services:
  wordpress:
    image: wordpress:6.5-php8.2-apache
    container_name: buildpro_wordpress
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-buildpro}
      WORDPRESS_DB_USER: ${MYSQL_USER:-buildpro}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-buildpro}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/buildpro:/var/www/html/wp-content/themes/buildpro

  db:
    image: mariadb:11.4
    container_name: buildpro_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-buildpro}
      MYSQL_USER: ${MYSQL_USER:-buildpro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-buildpro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: buildpro_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M

volumes:
  wordpress_data:
  db_data:
